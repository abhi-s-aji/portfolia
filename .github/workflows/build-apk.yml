name: Build and Release Portfolia APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK File
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/portfolia.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Portfolia v1.0.0"
          body: |
            ## Portfolia - Portfolio & Project Manager
            
            Download `portfolia.apk` below to install on your Android device!
          draft: false
          prerelease: false
          files: output/portfolia.apk

name: Build and Release Portfolia APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradle Wrapper Exists
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating Gradle Wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Prepare APK File
        run: |
          mkdir -p output/
          cp app/build/outputs/apk/debug/app-debug.apk output/portfolia.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Portfolia v1.0.0"
          body: |
            ## Portfolia - Portfolio & Project Manager
            
            ### Highlights
            * Complete Jetpack Compose Material3 Design
            * Room Database integration with offline storage
            * Dynamic search and category filtering
            * Developer Profile with Resume PDF support
            
            Download `portfolia.apk` below to install on your Android device!
          draft: false
          prerelease: false
          files: output/portfolia.apk
